<!DOCTYPE html>
<html>
<head>
    <title>Steel Furnace Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white p-5">
    <div class="container border p-4">
        <h2>Furnace #1 Control Panel</h2>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <h4>Temperature: <span id="temp-value" class="badge bg-secondary">1050</span> °C</h4>
            </div>
            <div class="col-md-6">
                <h4>Status: <span id="status-indicator" class="text-danger">Critical</span></h4>
            </div>
        </div>
    </div>
</body>
</html>
